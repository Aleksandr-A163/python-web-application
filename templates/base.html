<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    >
    <title>{% block title %}Телефонный справочник{% endblock %}</title>
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('index') }}">
          Телефонный справочник
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavigation"
          aria-controls="mainNavigation"
          aria-expanded="false"
          aria-label="Открыть навигацию"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                class="nav-link{% if active_page == 'index' %} active{% endif %}"
                href="{{ url_for('index') }}"
                {% if active_page == 'index' %}aria-current="page"{% endif %}
              >Главная</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link{% if active_page == 'about' %} active{% endif %}"
                href="{{ url_for('about') }}"
                {% if active_page == 'about' %}aria-current="page"{% endif %}
              >О проекте</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5 flex-grow-1">
      {% block content %}{% endblock %}
    </main>

    <footer class="border-top bg-white py-3">
      <div class="container text-center text-muted small">
        Учебное веб-приложение на FastAPI
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
